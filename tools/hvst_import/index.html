<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HVST 이관 도구</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>구형 HVST → LAFhvst 이관</h1>
      <p class="muted">기존 자료는 유지되고, 중복은 자동으로 건너뜁니다. 실행 전 <b>lafhvst.db 백업</b>을 권장합니다.</p>
    </header>

    <section class="card">
      <div class="field">
        <label for="dbPath">구형 hvst.db 경로</label>
        <input type="text" id="dbPath" placeholder="C:\...\hvst\data\hvst.db">
      </div>
      <div class="field">
        <label for="settingsPath">구형 hvst_setting.json 경로</label>
        <input type="text" id="settingsPath" placeholder="C:\...\hvst\data\hvst_setting.json">
      </div>
      <label class="check">
        <input type="checkbox" id="includeSecrets">
        <span>자격증명 포함 (cookies/토큰/비밀번호) — <b>기본 제외, 신중히 사용</b></span>
      </label>
      <div class="actions">
        <button id="previewBtn" class="btn primary" type="button">미리보기</button>
        <button id="applyBtn" class="btn" type="button">이관 실행</button>
      </div>
      <p id="status" class="status muted"></p>
    </section>

    <section class="card">
      <h2>제외 선택 (열 / 행)</h2>
      <p class="muted">제외할 열은 체크 해제, 제외할 행(항목)은 미리보기 목록에서 선택합니다. 폴더 주기는 <b>디폴트(수동)</b>로 이관됩니다.</p>
      <div class="exclude-grid">
        <div>
          <h3>제외할 열</h3>
          <div id="colFolder" class="col-list"></div>
          <div id="colSource" class="col-list"></div>
        </div>
        <div>
          <h3>제외할 행 (미리보기 후 선택)</h3>
          <div id="rowFilter" class="row-filter">
            <input type="text" id="rowSearch" placeholder="url/site/key/id 검색" disabled>
            <div id="rowPickList" class="row-pick"><p class="muted">먼저 미리보기를 실행하세요.</p></div>
          </div>
          <p id="rowSelCount" class="muted">선택 0건</p>
        </div>
      </div>
    </section>

    <section id="inspectCard" class="card hidden">
      <h2>요약</h2>
      <div id="inspectBody" class="grid"></div>
    </section>

    <section id="planCard" class="card hidden">
      <h2>미리보기 결과</h2>
      <div id="planSummary" class="summary"></div>
      <div class="tabs">
        <button id="tabFolders" class="tab active" type="button">폴더</button>
        <button id="tabSources" class="tab" type="button">소스</button>
      </div>
      <div class="table-wrap">
        <table id="planTable"><thead></thead><tbody></tbody></table>
      </div>
    </section>

    <section id="reportCard" class="card hidden">
      <h2>이관 리포트</h2>
      <div id="reportBody" class="grid"></div>
      <div id="warnings"></div>
    </section>
  </main>
  <script src="ui.js"></script>
</body>
</html>
