<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>게시물 추천 · LAFhvst</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=46">
  <link rel="stylesheet" href="css/recommend.css?v=46">
</head>
<body class="rec-body">
  <header class="rec-header">
    <div class="rec-title">
      <h1>게시물 추천</h1>
      <p class="muted" id="recStatus">불러오는 중…</p>
    </div>
    <div class="rec-controls">
      <select id="recDays" class="rec-select" title="기간">
        <option value="7">최근 7일</option>
        <option value="30" selected>최근 30일</option>
        <option value="90">최근 90일</option>
        <option value="365">최근 1년</option>
        <option value="0">전체 기간</option>
      </select>
      <select id="recSite" class="rec-select" title="사이트">
        <option value="">전체 사이트</option>
      </select>
      <input type="search" id="recQuery" class="rec-input" placeholder="업로더 / 제목 / 게시물ID 검색">
      <label class="rec-check"><input type="checkbox" id="recSensitive"> 민감 포함</label>
      <button class="btn" id="recReload" type="button">새로고침</button>
      <button class="btn primary" id="recIndex" type="button">색인 갱신</button>
    </div>
  </header>

  <main class="rec-main">
    <section class="rec-section">
      <div class="rec-sec-head">
        <h2>최근글</h2>
        <span class="muted" id="recentMeta"></span>
      </div>
      <div class="rec-grid" id="recentGrid"></div>
    </section>

    <section class="rec-section">
      <div class="rec-sec-head">
        <h2>인기글</h2>
        <span class="muted" id="popularMeta"></span>
      </div>
      <div class="rec-grid" id="popularGrid"></div>
    </section>

    <section class="rec-section">
      <div class="rec-sec-head">
        <h2>드문 업로더</h2>
        <span class="muted" id="rareMeta"></span>
      </div>
      <div class="rec-grid rec-uploader-grid" id="rareGrid"></div>
    </section>
  </main>

  <div class="rec-modal hidden" id="recModal">
    <div class="rec-modal-box" role="dialog" aria-modal="true" aria-label="게시물 상세">
      <button class="rec-modal-close" id="recModalClose" type="button" aria-label="닫기">×</button>
      <div class="rec-modal-media">
        <img id="recModalImage" alt="">
      </div>
      <div class="rec-modal-body" id="recModalBody"></div>
    </div>
  </div>

  <script src="js/recommend.js?v=46"></script>
</body>
</html>
